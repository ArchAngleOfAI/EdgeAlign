# Real prototype-phase training config -- meant for the A100 GPU cluster.
# Do not run this on a local dev machine: it loads the full Qwen 3 32B
# checkpoint and the real training corpora.
#
# WARNING (2026-09-15): this checkpoint has an unresolved real bf16
# numerical bug -- see MEMORY.md "Real-weights smoke test -- Qwen 3
# 32B, and a real bf16 bug found". Do not use this config for a real
# training run until that's fixed and re-verified. configs/qwen3_8b.yaml
# is the working stopgap in the meantime.
#
# This branch (self-embedding) implements v2:
# PROMPTS/soft_prompt_generator_spec_v2_self_embedding.md.
# generator.type = "self_embedding" -- hidden_size/num_hidden_layers are
# NOT set here; edgealign/train.py's build_generator() fills them in
# automatically from the loaded Qwen 3 32B checkpoint's own config, so
# they can never drift out of sync with whichever model is actually
# loaded.

model:
  # Local cached copy on the training cluster (avoids a ~64GB download
  # from the HF Hub id "Qwen/Qwen3-32B") -- see MEMORY.md "Real-weights
  # smoke test" for how this path was found.
  name_or_path: "/data/models/huggingface/qwen3-32b"
  dtype: "bfloat16"
  device_map: "auto"   # shards the model across all visible A100s on the node
  trust_remote_code: false

generator:
  type: "self_embedding"
  n_soft_tokens: 16
  extra: {}

data:
  mode: "real"
  max_seq_len: 1024
  batch_size: 8
  eval_fraction: 0.02   # held out for the KL-divergence success criterion (spec section 7)
  max_eval_batches: 50
  sources:
    # Weights are a starting point (spec section 6.4 leaves the exact
    # ratio tunable) -- retune once real training signal is available.
    - name: "opencodeinstruct"
      weight: 0.45
      extra:
        require_pass: true
    - name: "xlam"
      weight: 0.10
      extra: {}
    - name: "stack_edu"
      weight: 0.45
      extra:
        # Must point at the output of scripts/prepare_stack_edu.py, run
        # once on the cluster before starting training.
        prepared_path: "/data/stack_edu_prepared"

train:
  learning_rate: 0.0001
  max_steps: 20000
  eval_every: 500
  aux_loss_weight: 0.01
  log_every: 20
  seed: 0
  output_dir: "checkpoints/prototype_run"
